<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاکتورپرو | صدور فاکتور حرفه‌ای فارسی</title>
<style>
:root { --bg:#0a0a0a; --fg:#fafafa; --muted:#888; --card:#111; --border:#222; }
body { font-family: system-ui, Vazirmatn, sans-serif; background:var(--bg); color:var(--fg); margin:0; line-height:1.8; }
.container { max-width:900px; margin:0 auto; padding:4rem 1.5rem; text-align:center; }
h1 { font-size:clamp(2.2rem,6vw,3.5rem); }
.btn { background:#fff; color:#000; padding:1rem 2rem; text-decoration:none; border-radius:8px; font-weight:700; }
.features { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); margin:3rem 0; }
.card { background:var(--card); padding:1.5rem; border-radius:12px; border:1px solid var(--border); }
@media (prefers-color-scheme: light) { :root { --bg:#fff; --fg:#111; --muted:#555; --card:#f7f7f7; --border:#eee; } }
</style>
</head>
<body>
<div class="container">
  <h1>فاکتورپرو</h1>
  <p>صدور فاکتور حرفه‌ای، پیگیری پرداخت و گزارش‌گیری ساده برای کسب‌وکارهای ایرانی</p>
  <a href="#" class="btn">شروع رایگان ۱۴ روزه</a>
  <div class="features">
    <div class="card">فاکتور فارسی حرفه‌ای</div>
    <div class="card">پرداخت آنلاین</div>
    <div class="card">گزارش مالیاتی</div>
  </div>
  <section>
    <h2>قیمت‌گذاری</h2>
    <p>پایه — ۱۹۹,۰۰۰ تومان/ماه | حرفه‌ای — ۴۹۹,۰۰۰ تومان/ماه</p>
  </section>
</div>
</body>
</html>
